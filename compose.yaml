services:
  db:
    image: postgres:17
    command: ["postgres", "-c", "timezone=Africa/Cairo"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-makkah}
      POSTGRES_USER: ${POSTGRES_USER:-makkah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-makkah-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-makkah} -d ${POSTGRES_DB:-makkah}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      target: development
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma generate && npx prisma migrate deploy && npm run db:seed && npm run dev -- --hostname 0.0.0.0"]
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://makkah:makkah-local-only@db:5432/makkah?schema=public}
      AUTH_SECRET: ${AUTH_SECRET:-local-only-secret-do-not-use-in-production-change-this}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-owner@makkah.eg}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Makkah-Local-2026!}
      MAKKA_AI_PROVIDER: ${MAKKA_AI_PROVIDER:-}
      MAKKA_AI_API_KEY: ${MAKKA_AI_API_KEY:-}
      MAKKA_AI_MODEL: ${MAKKA_AI_MODEL:-}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres_data:
  node_modules:
  next_cache:
